[workspace]
members = [
    "crates/vortex-store",
    "crates/vortex-router",
    "crates/vortex-gateway",
    "crates/ai-web-provider",
    "crates/channel-client",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.44"
edition = "2024"
license = "MIT"
authors = ["Vortex"]

[workspace.dependencies]
# 中央推送客户端（channel.v1 双向流长连接，kit/channel/server 独立部署服务端；
# vendor 副本，源实现位于本机 kit 仓库（与 geo-pet 共用），更新时手动同步）
channel-client = { path = "crates/channel-client" }
