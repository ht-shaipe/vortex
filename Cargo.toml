[workspace]
members = [
    "crates/vortex-store",
    "crates/vortex-router",
    "crates/vortex-gateway",
    "crates/ai-web-provider",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.23"
edition = "2024"
license = "MIT"
authors = ["Vortex"]

[workspace.dependencies]
# 中央推送客户端（channel.v1 双向流长连接，kit/channel/server 独立部署服务端；
# path 指向本机 kit 仓库，与 geo-pet 项目共用同一份实现）
channel-client = { path = "../../../rust/kit/channel/client" }
