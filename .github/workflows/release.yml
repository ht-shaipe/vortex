name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，纯 semver，不要加 v 前缀（如 0.2.0；填 v0.2.0 也会自动清洗）'
        required: true

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        shell: bash
        run: |
          # lockfile 只在开发者平台生成，CI 其他平台原生绑定缺失
          rm -f bun.lock package-lock.json
          cp package.json package.json.bak          # 备份，防止 bun install <pkg> 污染
          bun install
          # 兜底：显式安装 rolldown / oxc-parser 当前平台原生绑定
          if [ "${{ runner.os }}" = "Linux" ]; then
            bun install @rolldown/binding-linux-x64-gnu @oxc-parser/binding-linux-x64-gnu
          elif [ "${{ runner.os }}" = "macOS" ]; then
            bun install @rolldown/binding-darwin-arm64 @oxc-parser/binding-darwin-arm64
          elif [ "${{ runner.os }}" = "Windows" ]; then
            bun install @rolldown/binding-win32-x64-msvc @oxc-parser/binding-win32-x64-msvc
          fi
          mv package.json.bak package.json          # 还原，CI 不提交意外改动

      - name: Build frontend
        run: bun run build

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # 规范化：去掉可能的 v 前缀与首尾空白，保证是合法 semver
          VERSION=$(printf '%s' "$VERSION" | sed 's/^v//' | tr -d '[:space:]')
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Determined version '$VERSION' is not a valid semver (expect e.g. 0.1.1, do NOT include a leading v)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync tauri version
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "tauri.conf.json version synced to $APP_VERSION"

      - name: Pre-create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          # 幂等创建：多平台并发时可能已被其他 job 创建，忽略 422 冲突
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Vortex v${{ steps.ver.outputs.version }}" \
              --notes "See the assets below to download and install this version." \
              --draft=false 2>&1 || true
          fi
          echo "Release $TAG ready"

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TARGET_DIR: target
        run: |
          cd src-tauri
          bunx tauri build --target ${{ matrix.target }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"

          echo "=== Collecting artifacts for $TARGET ==="
          FILES=()

          # macOS: .app.tar.gz + .sig, .dmg
          # 两个 macOS target（aarch64/x86_64）生成的 .app.tar.gz 同名，
          # 必须按架构重命名避免互相覆盖
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARCH_SUFFIX=""
            case "$TARGET" in
              aarch64-apple-darwin) ARCH_SUFFIX="-aarch64" ;;
              x86_64-apple-darwin)  ARCH_SUFFIX="-x86_64" ;;
            esac
            for f in "$BUNDLE_DIR"/macos/*.tar.gz "$BUNDLE_DIR"/macos/*.tar.gz.sig; do
              if [ -f "$f" ]; then
                BASENAME=$(basename "$f")
                # 在扩展名前插入架构后缀：Vortex.app.tar.gz → Vortex-aarch64.app.tar.gz
                if [[ "$BASENAME" == *.sig ]]; then
                  ROOT="${BASENAME%.sig}"
                  ROOTNAME="${ROOT%.app.tar.gz}"
                  NEWNAME="${ROOTNAME}${ARCH_SUFFIX}.app.tar.gz.sig"
                else
                  ROOTNAME="${BASENAME%.app.tar.gz}"
                  NEWNAME="${ROOTNAME}${ARCH_SUFFIX}.app.tar.gz"
                fi
                cp "$f" "/tmp/$NEWNAME"
                FILES+=("/tmp/$NEWNAME")
              fi
            done
            for f in "$BUNDLE_DIR"/dmg/*.dmg; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi
          # Linux: .tar.gz + .sig (updater), .deb, .appimage, .rpm
          if [ "${{ runner.os }}" = "Linux" ]; then
            for f in "$BUNDLE_DIR"/appimage/*.tar.gz "$BUNDLE_DIR"/appimage/*.tar.gz.sig \
                     "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/rpm/*.rpm; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi
          # Windows: .tar.gz + .sig (updater), .msi, .exe (nsis)
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in "$BUNDLE_DIR"/msi/*.tar.gz "$BUNDLE_DIR"/msi/*.tar.gz.sig \
                     "$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/nsis/*.exe; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No bundle artifacts found in $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f 2>/dev/null || echo "(bundle dir empty)"
            exit 1
          fi

          echo "Uploading ${#FILES[@]} file(s) to $TAG:"
          printf '  %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          echo "✓ Upload complete"

      - name: Upload updater manifest fragment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          VERSION="${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          REPO="${{ github.repository }}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"

          case "$TARGET" in
            x86_64-unknown-linux-gnu)   PLATFORM_KEY="linux-x86_64" ;;
            aarch64-apple-darwin)       PLATFORM_KEY="darwin-aarch64" ;;
            x86_64-apple-darwin)        PLATFORM_KEY="darwin-x86_64" ;;
            x86_64-pc-windows-msvc)     PLATFORM_KEY="windows-x86_64" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac

          SIG_FILE=$(find "$BUNDLE_DIR" -name "*.sig" -type f | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "::error::No .sig file found in $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f
            exit 1
          fi
          SIGNATURE=$(cat "$SIG_FILE")

          SIG_BASENAME=$(basename "$SIG_FILE")
          ARCHIVE_NAME="${SIG_BASENAME%.sig}"
          # macOS 两个 target 上传时按架构重命名了，url 也要指向重命名后的文件
          case "$TARGET" in
            aarch64-apple-darwin) ARCHIVE_NAME="${ARCHIVE_NAME%.app.tar.gz}-aarch64.app.tar.gz" ;;
            x86_64-apple-darwin)  ARCHIVE_NAME="${ARCHIVE_NAME%.app.tar.gz}-x86_64.app.tar.gz" ;;
          esac
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ARCHIVE_NAME}"

          echo "Platform:  $PLATFORM_KEY"
          echo "Signature: ${SIGNATURE:0:20}..."
          echo "URL:       $DOWNLOAD_URL"

          export PLATFORM_KEY SIGNATURE DOWNLOAD_URL VERSION
          node -e "
            const fragment = {
              version: process.env.VERSION,
              platforms: {
                [process.env.PLATFORM_KEY]: {
                  signature: process.env.SIGNATURE,
                  url: process.env.DOWNLOAD_URL
                }
              }
            };
            console.log(JSON.stringify(fragment, null, 2));
          " > "fragment-${PLATFORM_KEY}.json"

          gh release upload "$TAG" "fragment-${PLATFORM_KEY}.json" --clobber --repo "$REPO"
          echo "✓ Fragment uploaded for $PLATFORM_KEY"

      - name: Inject usage notes into macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          DMG=$(ls "$DMG_DIR"/*.dmg | head -n 1)
          if [ -z "$DMG" ]; then echo "No DMG found, skipping"; exit 0; fi
          echo "DMG found: $DMG"
          MNT=$(mktemp -d)
          SHADOW="$MNT.shadow.cow"
          hdiutil attach "$DMG" -shadow "$SHADOW" -mountpoint "$MNT" -nobrowse -noautoopen
          cp "src-tauri/dmg/使用说明.txt" "$MNT/"
          hdiutil detach "$MNT"
          hdiutil convert "$DMG" -shadow "$SHADOW" -format UDZO -o "${DMG%.dmg}-notes.dmg" -ov
          mv "${DMG%.dmg}-notes.dmg" "$DMG"
          rm -f "$SHADOW"
          gh release upload "v${{ steps.ver.outputs.version }}" "$DMG" --clobber --repo "${{ github.repository }}"
          echo "✓ 使用说明已注入 DMG 并覆盖上传"
  merge-manifest:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION=$(printf '%s' "$VERSION" | sed 's/^v//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Merge fragments into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          VERSION="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"

          mkdir -p fragments
          gh release download "$TAG" --repo "$REPO" --pattern "fragment-*.json" --dir fragments 2>/dev/null || true

          FRAGMENT_COUNT=$(find fragments -name "fragment-*.json" | wc -l)
          echo "Found $FRAGMENT_COUNT fragment(s)"
          if [ "$FRAGMENT_COUNT" -eq 0 ]; then
            echo "::error::No fragment files found"
            exit 1
          fi

          export VERSION
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const platforms = {};
            for (const f of fs.readdirSync('fragments')) {
              if (!f.startsWith('fragment-')) continue;
              const frag = JSON.parse(fs.readFileSync(path.join('fragments', f)));
              Object.assign(platforms, frag.platforms);
              console.log('  merged:', f);
            }
            const manifest = {
              version,
              pub_date: new Date().toISOString(),
              notes: 'See the assets below to download and install this version.',
              platforms
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log('--- latest.json ---');
            console.log(JSON.stringify(manifest, null, 2));
          "

          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
          echo "✓ latest.json uploaded"

          # Clean up fragment files from release
          for f in fragments/fragment-*.json; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            ASSET_ID=$(gh api repos/${REPO}/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | select(.name==\"$BASENAME\") | .id" 2>/dev/null)
            [ -n "$ASSET_ID" ] && gh api --method DELETE repos/${REPO}/releases/assets/$ASSET_ID 2>/dev/null || true
          done
          echo "✓ Fragment files cleaned up"
