name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'bump version')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Linux deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Install frontend deps
      shell: bash
      run: |
        npm ci
        # 兜底 npm#4828：rolldown 原生绑定缺失时按平台补装
        if ! node -e "import('rolldown').then(()=>{},()=>process.exit(1))"; then
          echo "rolldown native binding missing, installing fallback"
          case "${{ runner.os }}" in
            Linux)   npm install --no-save @rolldown/binding-linux-x64-gnu @rolldown/binding-wasm32-wasi ;;
            macOS)   npm install --no-save @rolldown/binding-darwin-arm64 @rolldown/binding-wasm32-wasi ;;
            Windows) npm install --no-save @rolldown/binding-win32-x64-msvc @rolldown/binding-wasm32-wasi ;;
          esac
        fi

    - name: Build frontend
      run: npm run build

    - name: Build
      working-directory: src-tauri
      run: cargo build --verbose

    - name: Run tests
      working-directory: src-tauri
      run: cargo test --verbose
