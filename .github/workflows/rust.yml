name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'bump version')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Linux deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Install frontend deps
      run: |
        # lockfile 通常只在 macOS 生成，Linux/Windows 原生绑定缺失
        # 删除 lockfile 后全新安装，确保当前平台 optional deps 被解析
        rm -f bun.lock package-lock.json
        bun install
        # 兜底：显式安装 rolldown / oxc-parser 当前平台原生绑定
        case "$(uname -s)" in
          Linux)  bun install @rolldown/binding-linux-x64-gnu @oxc-parser/binding-linux-x64-gnu ;;
          Darwin) bun install @rolldown/binding-darwin-arm64  @oxc-parser/binding-darwin-arm64  ;;
          *)      bun install @rolldown/binding-win32-x64-msvc @oxc-parser/binding-win32-x64-msvc ;;
        esac

    - name: Build frontend
      run: bun run build

    - name: Build
      working-directory: src-tauri
      run: cargo build --verbose

    - name: Run tests
      working-directory: src-tauri
      run: cargo test --verbose
