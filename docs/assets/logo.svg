<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vortex">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 左侧三条连接线 + 圆点（输入） -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" fill="#fff">
    <path d="M8 20 L20 26" opacity=".7"/>
    <path d="M8 32 L20 32" opacity=".85"/>
    <path d="M8 44 L20 38" opacity=".7"/>
    <circle cx="8" cy="20" r="2.2"/>
    <circle cx="8" cy="32" r="2.2"/>
    <circle cx="8" cy="44" r="2.2"/>
  </g>

  <!-- 中心圆环 -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#fff" stroke-width="3" opacity=".25"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#fff" stroke-width="2.5"/>

  <!-- V 字母 -->
  <path d="M27 26 L32 39 L37 26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右侧箭头（输出） -->
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M44 32 L56 32"/>
    <path d="M51 27 L56 32 L51 37"/>
  </g>
</svg>
