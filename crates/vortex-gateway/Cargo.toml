[package]
name = "vortex-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
vortex-store = { path = "../vortex-store" }
vortex-router = { path = "../vortex-router" }
# Web 服务器（rustls feature：bind_rustls，TLS 终结，与 awc 的 rustls 0.20 依赖树一致）
actix-web = { version = "4", features = ["rustls"] }
rustls = "0.20"
rustls-pemfile = "1"
# 自签证书生成（本地 CA + localhost 服务器证书）
rcgen = "0.12"
actix-cors = "0.7"
actix-rt = "2"
# HTTP 客户端
awc = { version = "3", features = ["rustls"] }
# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
log = "0.4"
# 并发
parking_lot = "0.12"
# 时间
chrono = { version = "0.4", features = ["serde"] }
# UUID
uuid = { version = "1", features = ["v4"] }
# URL
url = "2"
# bytes（responses.rs 测试用）
bytes = "1.12.1"
# 配置文件解析（agent_integrations 适配器）
jsonc-parser = { version = "0.33", features = ["cst", "serde"] }
toml_edit = { version = "0.25", features = ["serde"] }
yaml-edit = "0.2"
# 文件安全写入（agent_integrations）
fs2 = "0.4"
tempfile = "3"
sha2 = "0.10"
# 日志初始化（vortex-server binary）
env_logger = "0.11"

[[bin]]
name = "vortex-server"
path = "src/bin/vortex-server.rs"
