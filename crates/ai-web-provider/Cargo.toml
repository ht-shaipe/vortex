[package]
name = "ai-web-provider"
description = "多平台 AI 网关核心库：obscura 驱动的平台 provider、HTTP 服务与 OpenAI/Anthropic 兼容层"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
# fork：包含 op_initial_frame reentrant 修复，避免 srcdoc iframe 重入导致进程 abort
obscura = { git = "https://github.com/ht-shaipe/obscura", rev = "6594672b9bc3c41d7f67ff3159df544e67da9d70" }
actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.23"
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
qrcodegen = "1.8"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate", "native-tls"], default-features = false }
regex = "1"
uuid = { version = "1", features = ["v4"] }
